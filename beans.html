<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>咖手 · 豆子百科</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { background:#faf6f0; color:#3f2e22; margin:0; font-family:"Microsoft YaHei","PingFang SC",sans-serif; }
  .beans-wrap { max-width:1060px; margin:0 auto; padding:0 20px 70px; }
  .beans-header { text-align:center; padding:46px 10px 10px; }
  .beans-header h1 { font-size:34px; letter-spacing:3px; margin:0; }
  .beans-header .sub { color:#8a6a4f; margin-top:8px; font-size:15px; }
  .home-link { position:absolute; top:18px; left:20px; color:#7a4f2a; text-decoration:none; font-size:14px; }
  .filters { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:22px 0 8px; }
  .filter { border:1px solid #d8c6ae; background:#fff; color:#6b543f; border-radius:999px; padding:7px 18px; cursor:pointer; font-size:14px; }
  .filter.active { background:#6f4e37; color:#fff; border-color:#6f4e37; }
  .bean-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:18px; margin-top:18px; }
  .bean-card { background:#fff; border-radius:16px; padding:20px; cursor:pointer; box-shadow:0 4px 16px rgba(63,46,34,.07); transition:transform .15s; }
  .bean-card:hover { transform:translateY(-4px); }
  .bean-card .axis { font-size:12px; color:#a9743f; font-weight:bold; }
  .bean-card h3 { margin:8px 0 4px; font-size:19px; }
  .bean-card .region { color:#9b8a78; font-size:12px; margin-bottom:10px; }
  .bean-card .flavors span { display:inline-block; background:#f3e5d0; color:#7a4f2a; border-radius:999px; padding:2px 10px; font-size:12px; margin:2px 4px 2px 0; }
  .bean-card .like { margin-top:10px; color:#7a6250; font-size:13px; }
  .overlay { position:fixed; inset:0; background:rgba(30,20,12,.55); display:none; align-items:center; justify-content:center; z-index:50; padding:18px; }
  .overlay.show { display:flex; }
  .detail { background:#fff; border-radius:20px; max-width:680px; width:100%; max-height:88vh; overflow:auto; padding:30px 32px; position:relative; }
  .detail .close { position:absolute; top:14px; right:18px; font-size:26px; cursor:pointer; color:#9b8a78; background:none; border:none; }
  .detail h2 { margin:0 0 4px; font-size:26px; }
  .detail .axis-tag { display:inline-block; background:#6f4e37; color:#fff; border-radius:999px; padding:3px 12px; font-size:12px; }
  .detail .meta { margin:12px 0; background:#faf3ea; border-radius:12px; padding:14px 16px; font-size:14px; line-height:2; }
  .detail .meta b { color:#6f4e37; }
  .detail h4 { margin:18px 0 6px; color:#6f4e37; font-size:15px; border-left:4px solid #c89a6a; padding-left:8px; }
  .detail p { line-height:1.9; font-size:14.5px; color:#4a3728; }
  .detail .facts li { font-size:13px; color:#8a6a4f; margin:4px 0; }
  .drink-item { border:1px solid #eadfce; border-radius:12px; padding:12px 14px; margin:8px 0; font-size:14px; }
  .drink-item .dr-name { font-weight:bold; color:#3f2e22; }
  .drink-item .dr-meta { color:#8a6a4f; font-size:12.5px; margin-top:4px; line-height:1.7; }
  .drink-item a { color:#a9743f; font-size:12.5px; text-decoration:none; }
  .warn { font-size:12px; color:#b08758; margin-top:8px; }
  .similar a { display:inline-block; background:#f3e5d0; color:#7a4f2a; text-decoration:none; border-radius:999px; padding:5px 14px; font-size:13px; margin:4px 6px 0 0; }
  .no-data { color:#9b8a78; font-size:13px; }
</style>
</head>
<body>
<a class="home-link" href="index.html">← 返回首页</a>
<div class="beans-wrap">
  <div class="beans-header">
    <h1>🫘 豆子百科</h1>
    <div class="sub">点开任何一支豆，看它的档案、故事，以及市面上对应的产品</div>
  </div>
  <div class="filters" id="filters">
    <button class="filter active" data-axis="all">全部</button>
    <button class="filter" data-axis="sour">酸 · 明亮</button>
    <button class="filter" data-axis="sweet">甜 · 醇厚</button>
    <button class="filter" data-axis="bitter">苦 · 浓烈</button>
    <button class="filter" data-axis="floral">平衡 · 花果</button>
    <button class="filter" data-axis="aroma">香 · 馥郁</button>
  </div>
  <div class="bean-grid" id="grid"></div>
</div>

<div class="overlay" id="overlay">
  <div class="detail" id="detail"></div>
</div>

<script src="beans.js"></script>
<script src="drinks.js" onerror="window.DRINKS=[]"></script>
<script>
  const AXIS_LABEL = { sour:"酸 · 明亮", sweet:"甜 · 醇厚", bitter:"苦 · 浓烈", floral:"平衡 · 花果", aroma:"香 · 馥郁" };
  let currentFilter = "all";
  const grid = document.getElementById("grid");
  const overlay = document.getElementById("overlay");
  const detail = document.getElementById("detail");

  function renderGrid(){
    const list = BEANS.filter(b => currentFilter === "all" || b.axis === currentFilter);
    grid.innerHTML = list.map(b => `
      <div class="bean-card" onclick="openBean('${b.id}')">
        <div class="axis">${AXIS_LABEL[b.axis] || b.axis}</div>
        <h3>${b.name}</h3>
        <div class="region">${b.region}</div>
        <div class="flavors">${b.flavors.map(f => `<span>${f}</span>`).join("")}</div>
        <div class="like">「${b.like}」</div>
      </div>`).join("");
  }

  function openBean(id){
    const b = BEANS.find(x => x.id === id);
    if(!b) return;
    const drinks = drinkMatches(b);
    const conf = b.confidence === "低" ? '<span class="axis-tag" style="background:#b08758;margin-left:8px">低置信 · 待核实</span>' : "";
    const secs = b.sections ? [
      ["产地档案", b.sections.origin],
      ["风味科学", b.sections.science],
      ["历史故事", b.sections.history],
      ["冲煮指南", b.sections.brew],
      ["健康与文化", b.sections.culture],
      ["市售对应", b.sections.market]
    ].filter(s => s[1]).map(s => `<h4>${s[0]}</h4><p>${s[1]}</p>`).join("")
    : `<h4>豆子的故事</h4><p>${b.story}</p>
      <h4>怎么冲</h4><p>${b.brew}</p>
      <h4>可查证的事实</h4><ul class="facts">${(b.facts||[]).map(f => `<li>${f}</li>`).join("")}</ul>`;
    const srcs = (b.sources || []).map(s => `<a href="${s.url}" target="_blank">${s.label} ↗</a>`).join(" ");
    detail.innerHTML = `
      <button class="close" onclick="overlay.classList.remove('show')">×</button>
      <h2>${b.name}</h2>
      <span class="axis-tag">${AXIS_LABEL[b.axis] || b.axis}</span>${conf}
      <div class="meta">
        <b>产区：</b>${b.region}<br>
        <b>品种：</b>${b.variety}<br>
        <b>处理法：</b>${b.process}　<b>烘焙度：</b>${b.roast}<br>
        <b>风味：</b>${b.flavors.join(" / ")}<br>
        <b>喝起来像：</b>「${b.like}」
      </div>
      ${secs}
      <h4>市售对应产品</h4>
      <div id="drink-box">${renderDrinks(drinks)}</div>
      <h4>口味相近的豆</h4>
      <div class="similar">${b.similar.map(s => {
        const sBean = BEANS.find(x => x.id === s);
        return sBean ? `<a onclick="openBean('${sBean.id}')">${sBean.name}</a>` : "";
      }).join("")}</div>
      ${srcs ? `<div class="warn">来源：${srcs} · 采集 2026-10</div>` : ""}
    `;
    overlay.classList.add("show");
  }

  function drinkAxis(d){
    const f = (d.flavor || "") + (d.beans || "");
    if (f.indexOf("偏酸") !== -1) return "sour";
    if (f.indexOf("偏苦") !== -1) return "bitter";
    if (f.indexOf("偏甜") !== -1) return "sweet";
    if (f.indexOf("偏香") !== -1) return "aroma";
    return "";
  }

  function drinkMatches(bean){
    if(!window.DRINKS || !window.DRINKS.length) return [];
    const short = (bean.name || "").split(" · ")[1] || bean.name;
    return window.DRINKS.filter(d => drinkAxis(d) === bean.axis || ((d.beans||"").indexOf(short) !== -1)).slice(0,4);
  }

  function renderDrinks(drinks){
    if(!drinks || !drinks.length) return `<div class="no-data">市售对应数据库整理中（调研完成后自动点亮）。</div>`;
    return drinks.map(d => {
      const conf = d.confidence === "低" ? `<span style="color:#b08758">（用豆信息置信度低 · 仅供参考）</span>` : "";
      const unpub = d.unpublished ? `<br><span style="color:#b08758">未公开：${d.unpublished}</span>` : "";
      const srcs = (d.source || []).map(u => `<a href="${u}" target="_blank">来源 ↗</a>`).join(" ");
      return `<div class="drink-item">
        <div class="dr-name">${d.brand || ""} · ${d.product || ""}${conf}</div>
        <div class="dr-meta">${d.type || ""} ｜ 用豆：${d.beans || ""} ｜ ${d.flavor || ""}${unpub}<br>${d.price_cny || ""}</div>
        <div class="dr-src">${srcs}</div>
      </div>`;
    }).join("") + `<div class="warn">数据采集于 2026-10，价格与配方以品牌官方最新信息为准。</div>`;
  }

  document.querySelectorAll(".filter").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".filter").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.dataset.axis;
      renderGrid();
    });
  });
  overlay.addEventListener("click", e => { if(e.target === overlay) overlay.classList.remove("show"); });
  renderGrid();
  // 深链：从旅程页点豆跳过来（beans.html?id=fushan）自动打开详情
  const qs = new URLSearchParams(location.search);
  if (qs.get("id")) setTimeout(() => openBean(qs.get("id")), 100);
</script>
</body>
</html>
